<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Quran Book Shape -->
  <path d="M160 360 C 220 340, 250 350, 256 360 C 262 350, 292 340, 352 360 L 352 200 C 292 180, 262 190, 256 200 C 250 190, 220 180, 160 200 Z" fill="#faf7ee" fill-opacity="0.95" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M256 200 L 256 360" stroke="#064e3b" stroke-width="3" />
  
  <!-- Arabic Calligraphy Letter Kha 'خ' in center -->
  <text x="256" y="170" font-family="'Amiri', 'Amiri Quran', serif" font-size="70" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">ختمتي</text>
  <circle cx="256" cy="115" r="9" fill="url(#goldGrad)" />
</svg>
